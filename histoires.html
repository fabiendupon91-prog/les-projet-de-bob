
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bibliothèque d'histoires - Les projets de Bob</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5dc;
      color: #222;
    }

    header {
      background: #222;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 10px;
    }

    header p {
      margin: 0;
      color: #ddd;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .navigation {
      margin-bottom: 25px;
    }

    a {
      color: inherit;
    }

    .retour {
      display: inline-block;
      background: #222;
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 6px;
    }

    .retour:hover {
      background: #444;
    }

    .recherche {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin: 15px 0 25px;
    }

    .grille {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(250px, 1fr)
      );
      gap: 20px;
    }

    .carte {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 10px #00000012;
    }

    .carte h2,
    .carte h3 {
      margin-top: 0;
    }

    .carte p {
      line-height: 1.6;
      color: #555;
    }

    .carte a {
      display: inline-block;
      background: #222;
      color: white;
      text-decoration: none;
      padding: 10px 15px;
      border-radius: 6px;
      margin-top: 10px;
    }

    .carte a:hover {
      background: #444;
    }

    .date {
      font-size: 13px;
      color: #777;
    }

    .lecture {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 10px #00000012;
    }

    .lecture h2 {
      font-size: 30px;
      margin-top: 0;
    }

    .texte-histoire {
      font-size: 18px;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #555;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 600px) {
      header {
        padding: 25px 15px;
      }

      .lecture {
        padding: 20px;
      }

      .lecture h2 {
        font-size: 24px;
      }

      .texte-histoire {
        font-size: 17px;
      }
    }
  </style>

  <script src="./histoires.js" defer></script>
</head>

<body>

  <header>
    <h1>📚 Bibliothèque d'histoires</h1>
    <p>Bienvenue dans l'univers des histoires de Bob !</p>
  </header>

  <main>

    <div class="navigation">
      <a class="retour" href="./index.html">
        ← Retour à l'accueil
      </a>
    </div>

    <div id="bibliotheque">
      <h2>Mes histoires</h2>
      <input
        type="search"
        id="recherche"
        class="recherche"
        placeholder="Rechercher une histoire ou une série..."
        aria-label="Rechercher une histoire ou une série"
      >
      <div id="liste-series" class="grille"></div>
      <div id="liste-histoires" class="grille"></div>
    </div>

    <section id="page-lecture" class="lecture" hidden>
      <div class="navigation">
        <a id="retour-serie" class="retour" href="./histoires.html">
          ← Retour
        </a>
      </div>

      <p id="nom-serie" class="date"></p>
      <h2 id="titre-histoire"></h2>
      <p id="date-histoire" class="date"></p>

      <hr>

      <div id="texte-histoire" class="texte-histoire"></div>
    </section>

    <div id="message-erreur" class="message" hidden></div>

  </main>

  <footer>
    <p>© Les projets de Bob</p>
  </footer>

</body>
</html>
